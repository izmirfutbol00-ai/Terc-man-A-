<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çeviri</title>
<style>
  :root { --bg:#f8f9fa; --card:#fff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --blue:#1a73e8; --blue-bg:#e8f0fe; --err:#c5221f; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202124; --card:#2d2e31; --ink:#e8eaed; --muted:#9aa0a6; --line:#4a4c50; --blue:#8ab4f8; --blue-bg:#394457; --err:#f28b82; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card); font-size:1.25rem; font-weight:500; }
  main { max-width:1040px; margin:24px auto; padding:0 16px; }
  .bar { display:grid; grid-template-columns:1fr 48px 1fr; align-items:center; gap:8px; margin-bottom:8px; }
  .side { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .chip, select, #swap, .tool { font:inherit; color:var(--ink); background:transparent; border:0; border-radius:18px; padding:6px 14px; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--blue-bg); color:var(--blue); font-weight:500; }
  .chip:hover, select:hover, .tool:hover, #swap:hover { background:var(--blue-bg); }
  select { border:1px solid var(--line); background:var(--card); max-width:150px; }
  #swap { font-size:1.2rem; width:44px; height:44px; padding:0; justify-self:center; }
  .panes { display:grid; grid-template-columns:1fr 1fr; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .pane { display:flex; flex-direction:column; min-height:260px; }
  .pane + .pane { border-left:1px solid var(--line); background:var(--bg); }
  textarea, #out { flex:1; width:100%; padding:16px; font:inherit; font-size:1.35rem; line-height:1.5; color:var(--ink); background:transparent; border:0; resize:none; outline:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .foot { display:flex; align-items:center; gap:8px; padding:6px 12px; color:var(--muted); font-size:.85rem; min-height:44px; }
  .foot .sp { flex:1; }
  #msg.err { color:var(--err); }
  .tool { font-size:.9rem; color:var(--muted); }
  .dict { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 20px 16px; }
  .dict[hidden] { display:none; }
  .dict h2 { font-size:1rem; font-weight:500; margin:12px 0 4px; }
  .dict h3 { font-size:.85rem; font-weight:500; color:var(--muted); margin:14px 0 4px; text-transform:capitalize; }
  .dict ul { list-style:none; margin:0; padding:0; }
  .dict li { display:flex; gap:12px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line); }
  .dict li:last-child { border-bottom:0; }
  .dict .w { min-width:130px; font-weight:500; }
  .dict .b { flex:1; color:var(--muted); }
  .dict .m { color:var(--blue); letter-spacing:2px; font-size:.7rem; }
  .dict .ex { font-style:italic; color:var(--muted); }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  @media (max-width:700px) {
    .panes, .bar { grid-template-columns:1fr; }
    .pane + .pane { border-left:0; border-top:1px solid var(--line); }
    .pane { min-height:180px; }
  }
</style>
</head>
<body>
<header>Çeviri</header>
<main>
  <div class="bar">
    <div class="side" id="srcBar"></div>
    <button id="swap" aria-label="Dilleri değiştir" title="Dilleri değiştir">⇄</button>
    <div class="side" id="tgtBar"></div>
  </div>
  <div class="panes">
    <section class="pane">
      <textarea id="inp" maxlength="5000" placeholder="Çevirmek için metin girin" aria-label="Kaynak metin" autofocus></textarea>
      <div class="foot"><span id="det"></span><span class="sp"></span><span id="cnt">0 / 5000</span><button class="tool" id="clr" hidden>Temizle</button></div>
    </section>
    <section class="pane">
      <div id="out" aria-live="polite" aria-label="Çeviri"></div>
      <div class="foot"><span id="msg" role="status"></span><span class="sp"></span><button class="tool" id="spk">Dinle</button><button class="tool" id="cp">Kopyala</button></div>
    </section>
  </div>
  <section class="dict" id="dict" hidden aria-label="Sözlük"></section>
</main>

<script>
(function () {
  var L = { auto:"Dili algıla", tr:"Türkçe", en:"İngilizce", de:"Almanca", fr:"Fransızca", es:"İspanyolca", it:"İtalyanca", pt:"Portekizce",
    ru:"Rusça", ar:"Arapça", fa:"Farsça", ja:"Japonca", ko:"Korece", "zh-CN":"Çince (Basit)", "zh-TW":"Çince (Geleneksel)", nl:"Felemenkçe",
    pl:"Lehçe", uk:"Ukraynaca", el:"Yunanca", hi:"Hintçe", az:"Azerbaycanca", kk:"Kazakça", uz:"Özbekçe", bg:"Bulgarca", ro:"Romence",
    cs:"Çekçe", sv:"İsveççe", da:"Danca", fi:"Fince", no:"Norveççe", hu:"Macarca", iw:"İbranice", id:"Endonezce", th:"Tayca",
    vi:"Vietnamca", sr:"Sırpça", hr:"Hırvatça", ka:"Gürcüce", hy:"Ermenice",
    af:"Afrikaanca", sq:"Arnavutça", bn:"Bengalce", bs:"Boşnakça", ca:"Katalanca", et:"Estonca", eu:"Baskça", gl:"Galiçyaca",
    gu:"Guceratça", is:"İzlandaca", ga:"İrlandaca", lv:"Letonca", lt:"Litvanca", mk:"Makedonca", ms:"Malayca", mt:"Maltaca",
    mn:"Moğolca", ne:"Nepalce", ps:"Peştuca", sk:"Slovakça", sl:"Slovence", so:"Somalice", sw:"Svahili", ta:"Tamilce",
    te:"Teluguca", ur:"Urduca", ku:"Kürtçe", tg:"Tacikçe", ky:"Kırgızca", la:"Latince", eo:"Esperanto", tl:"Filipince" };
  var $ = function (id) { return document.getElementById(id); };
  var S = { src: "auto", tgt: "en" };
  try { var saved = JSON.parse(localStorage.getItem("ceviri") || "{}"); if (L[saved.src]) S.src = saved.src; if (L[saved.tgt] && saved.tgt !== "auto") S.tgt = saved.tgt; } catch (e) {}
  var detected = "", seq = 0, timer = null, bars = [];

  function build(el, key, quick, withAuto) {
    var chips = document.createElement("div"); chips.className = "side";
    var btns = quick.map(function (c) {
      var b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = L[c];
      b.onclick = function () { S[key] = c; sync(); run(); }; chips.appendChild(b); return [c, b];
    });
    var sel = document.createElement("select"); sel.setAttribute("aria-label", key === "src" ? "Kaynak dil" : "Hedef dil");
    Object.keys(L).sort(function (a, b) { return a === "auto" ? -1 : b === "auto" ? 1 : L[a].localeCompare(L[b], "tr"); }).forEach(function (c) { if (c === "auto" && !withAuto) return; sel.add(new Option(L[c], c)); });
    sel.onchange = function () { S[key] = sel.value; sync(); run(); };
    el.appendChild(chips); el.appendChild(sel); bars.push({ key: key, btns: btns, sel: sel });
  }
  function sync() {
    bars.forEach(function (b) { b.sel.value = S[b.key]; b.btns.forEach(function (x) { x[1].setAttribute("aria-pressed", String(x[0] === S[b.key])); }); });
    try { localStorage.setItem("ceviri", JSON.stringify(S)); } catch (e) {}
  }
  build($("srcBar"), "src", ["auto", "tr", "en"], true);
  build($("tgtBar"), "tgt", ["tr", "en", "de"], false);
  sync();

  function fetchT(u) {
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 12000);
    return fetch(u, { signal: c.signal }).finally(function () { clearTimeout(t); });
  }
  var POS = { noun:"isim", verb:"fiil", adjective:"sıfat", adverb:"zarf", pronoun:"zamir", preposition:"edat", conjunction:"bağlaç",
    interjection:"ünlem", article:"tanımlık", abbreviation:"kısaltma", particle:"edat", phrase:"deyim", numeral:"sayı" };
  function strip(x) { return String(x || "").replace(/<[^>]*>/g, ""); }
  function dictOf(j) {
    var o = { dict: [], defs: [], exs: [] };
    try { (j[1] || []).forEach(function (e) {
      o.dict.push({ pos: POS[e[0]] || e[0], words: (e[2] || []).slice(0, 10).map(function (w) { return { t: w[0], back: (w[1] || []).slice(0, 5), f: w[3] || 0 }; }) });
    }); } catch (e) {}
    try { (j[12] || []).forEach(function (e) { (e[1] || []).slice(0, 2).forEach(function (d) { o.defs.push({ pos: POS[e[0]] || e[0], text: d[0], ex: d[2] || "" }); }); }); } catch (e) {}
    try { ((j[13] && j[13][0]) || []).slice(0, 3).forEach(function (x) { o.exs.push(strip(x[0])); }); } catch (e) {}
    return o;
  }
  async function gtx(s, rich) {
    var r = await fetchT("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t" + (rich ? "&dt=bd&dt=md&dt=ex&hl=tr" : "") +
      "&sl=" + S.src + "&tl=" + S.tgt + "&q=" + encodeURIComponent(s));
    if (!r.ok) throw new Error("Google " + r.status);
    var j = await r.json();
    return { t: j[0].map(function (x) { return x[0]; }).join(""), d: j[2], x: rich ? dictOf(j) : null };
  }
  function renderDict(x) {
    var box = $("dict"); box.textContent = "";
    if (!x || !(x.dict.length || x.defs.length || x.exs.length)) { box.hidden = true; return; }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    if (x.dict.length) box.appendChild(el("h2", "", "Çeviri seçenekleri"));
    x.dict.forEach(function (g) {
      box.appendChild(el("h3", "", g.pos));
      var ul = el("ul");
      g.words.forEach(function (w) {
        var li = el("li"), m = el("span", "m", w.f > 0.1 ? "●●●" : w.f > 0.01 ? "●●○" : "●○○");
        m.setAttribute("aria-label", w.f > 0.1 ? "sık kullanılır" : w.f > 0.01 ? "orta sıklıkta" : "az kullanılır");
        li.appendChild(el("span", "w", w.t)); li.appendChild(el("span", "b", w.back.join(", "))); li.appendChild(m); ul.appendChild(li);
      });
      box.appendChild(ul);
    });
    if (x.defs.length) {
      box.appendChild(el("h2", "", "Tanımlar"));
      var d = el("ul"); x.defs.forEach(function (e) { var li = el("li"); li.appendChild(el("span", "w", e.pos)); li.appendChild(el("span", "b", e.text + (e.ex ? "  “" + e.ex + "”" : ""))); d.appendChild(li); }); box.appendChild(d);
    }
    if (x.exs.length) {
      box.appendChild(el("h2", "", "Örnekler"));
      var u = el("ul"); x.exs.forEach(function (t) { var li = el("li"); li.appendChild(el("span", "ex", t)); u.appendChild(li); }); box.appendChild(u);
    }
    box.hidden = false;
  }
  async function myMemory(s) {
    var r = await fetchT("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(s) + "&langpair=" + (S.src === "auto" ? "Autodetect" : S.src) + "|" + S.tgt);
    var j = await r.json();
    if (!j.responseData || +j.responseStatus !== 200) throw new Error("MyMemory " + j.responseStatus);
    return { t: j.responseData.translatedText, d: "" };
  }
  async function piece(s, rich) { try { return await gtx(s, rich); } catch (e) { return await myMemory(s); } }

  function pieces(text) {
    var out = [];
    text.split("\n").forEach(function (line) {
      if (!line.trim()) { out.push(null); return; }
      while (line.length > 1500) { var i = line.lastIndexOf(" ", 1500); if (i < 300) i = 1500; out.push(line.slice(0, i)); line = line.slice(i).trim(); }
      out.push(line);
    });
    return out;
  }
  async function run() {
    var text = $("inp").value, id = ++seq;
    $("msg").textContent = ""; $("msg").className = "";
    if (!text.trim()) { $("out").textContent = ""; $("det").textContent = ""; $("dict").hidden = true; return; }
    try {
      var ps = pieces(text), rich = ps.length === 1 && ps[0] && ps[0].trim().split(/\s+/).length <= 4,
          res = await Promise.all(ps.map(function (p) { return p === null ? Promise.resolve(null) : piece(p, rich); }));
      if (id !== seq) return;
      $("out").textContent = res.map(function (r) { return r ? r.t : ""; }).join("\n");
      var first = res.filter(Boolean)[0];
      detected = S.src === "auto" && first && first.d ? first.d : "";
      $("det").textContent = detected ? (L[detected] || detected) + " (algılandı)" : "";
      renderDict(first && first.x);
    } catch (e) {
      if (id !== seq) return;
      $("msg").className = "err";
      $("msg").textContent = window.top !== window
        ? "Bu önizleme dış bağlantıya izin vermiyor. Dosyayı indirip tarayıcıda doğrudan açın."
        : "Çeviri servisine ulaşılamadı. İnternet bağlantınızı kontrol edin.";
    }
  }

  $("inp").addEventListener("input", function () {
    var v = this.value; $("cnt").textContent = v.length + " / 5000"; $("clr").hidden = !v;
    clearTimeout(timer); timer = setTimeout(run, 400);
  });
  $("clr").onclick = function () { $("inp").value = ""; $("out").textContent = ""; $("det").textContent = ""; $("dict").hidden = true; $("cnt").textContent = "0 / 5000"; $("clr").hidden = true; $("inp").focus(); };
  $("swap").onclick = function () {
    var newSrc = S.tgt, newTgt = S.src === "auto" ? (detected || "tr") : S.src, o = $("out").textContent;
    S.src = newSrc; S.tgt = newTgt; sync();
    if (o) { $("inp").value = o; $("cnt").textContent = o.length + " / 5000"; $("clr").hidden = false; }
    run();
  };
  $("cp").onclick = async function () {
    var t = $("out").textContent; if (!t) return;
    try { await navigator.clipboard.writeText(t); } catch (e) { var r = document.createRange(); r.selectNodeContents($("out")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
    this.textContent = "Kopyalandı"; var b = this; setTimeout(function () { b.textContent = "Kopyala"; }, 1500);
  };
  $("spk").onclick = function () {
    var t = $("out").textContent; if (!t || !window.speechSynthesis) return;
    speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = S.tgt === "iw" ? "he" : S.tgt; speechSynthesis.speak(u);
  };
})();
</script>
</body>
</html>
